name: E-commerce Analytics Pipeline

on:
  # Run at 02:00 UTC on the 1st day of every month
  schedule:
    - cron: "0 2 1 * *"

  # Allow manual execution
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  analytics-pipeline:
    runs-on: ubuntu-latest

    env:
      DB_HOST: ${{ secrets.POSTGRES_HOST }}
      DB_PORT: ${{ secrets.POSTGRES_PORT }}
      DB_NAME: ${{ secrets.POSTGRES_NAME }}
      DB_USER: ${{ secrets.POSTGRES_USER }}
      DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
      BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
      BIGQUERY_LOCATION: ${{ secrets.BIGQUERY_LOCATION }}

      POWERBI_CLIENT_ID: ${{ secrets.POWERBI_CLIENT_ID }}
      POWERBI_CLIENT_SECRET: ${{ secrets.POWERBI_CLIENT_SECRET }}
      POWERBI_TENANT_ID: ${{ secrets.POWERBI_TENANT_ID }}
      POWERBI_WORKSPACE_ID: ${{ secrets.POWERBI_WORKSPACE_ID }}
      POWERBI_DATASET_ID: ${{ secrets.POWERBI_DATASET_ID }}

    steps:
      ##########################################################
      # Checkout Repository
      ##########################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ##########################################################
      # Authenticate with Google Cloud (OIDC)
      ##########################################################

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      ##########################################################
      # Setup Python
      ##########################################################

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      ##########################################################
      # Install Dependencies
      ##########################################################

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      ##########################################################
      # Install dbt
      ##########################################################

      - name: Install dbt
        run: |
          pip install dbt-core
          pip install dbt-bigquery

      ##########################################################
      # Run ETL
      ##########################################################

      - name: Run ETL Pipeline
        run: |
          python etl/main.py

      ##########################################################
      # Run dbt
      ##########################################################

      - name: Install dbt Packages
        working-directory: ./dbt
        run: |
          dbt deps

      - name: Run dbt Models
        working-directory: ./dbt
        run: |
          dbt run

      - name: Test dbt Models
        working-directory: ./dbt
        run: |
          dbt test

      
      ##########################################################
      # Complete
      ##########################################################

      - name: Pipeline Complete
        run: echo "Pipeline completed successfully."